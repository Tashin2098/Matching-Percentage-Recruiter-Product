<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Product Requirement Flow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<!-- All page content is the JSON in #flowdata. Edit it by hand, or use the Edit page button (password protected). -->

<style id="page-style">/* Layout: sticky flow index on the left, one section per flow; each flow drawn on a dotted canvas,
   main path down the left column, exits branching right. Group colour (Clubs green, Join Me orange,
   shared/safety slate) marks success boxes and the flow's tag. */
:root {
  --bg: #f2f4f3;
  --panel: #fafbfa;
  --node: #ffffff;
  --ink: #15201c;
  --ink-2: #4d5b56;
  --ink-3: #6f7d78;
  --line: #8e9b96;
  --line-soft: #d6ddd9;
  --dot: #d3dad6;
  --club: #1d7552;
  --club-tint: #e2f1e9;
  --join: #c2531a;
  --join-tint: #fbe9dd;
  --core: #335472;
  --core-tint: #e3ebf3;
  --focus: #335472;
  --f-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Instrument Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --mainw: 340px;
  --brw: 320px;
  --gapx: 56px;
  --pt: 44px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1513; --panel: #141b19; --node: #1a2320; --ink: #e5ece9; --ink-2: #a6b3ae; --ink-3: #8a9893;
    --line: #6f7e78; --line-soft: #2b3632; --dot: #26302d;
    --club: #4fc191; --club-tint: #16301f; --join: #f08c4e; --join-tint: #3a2216; --core: #8fb3d6; --core-tint: #1b2936;
    --focus: #8fb3d6; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1513; --panel: #141b19; --node: #1a2320; --ink: #e5ece9; --ink-2: #a6b3ae; --ink-3: #8a9893;
  --line: #6f7e78; --line-soft: #2b3632; --dot: #26302d;
  --club: #4fc191; --club-tint: #16301f; --join: #f08c4e; --join-tint: #3a2216; --core: #8fb3d6; --core-tint: #1b2936;
  --focus: #8fb3d6; color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
a { color: inherit; }
a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

.page { max-width: 1180px; margin: 0 auto; padding-block: 40px 96px; }

/* header */
.top { display: grid; gap: 12px; max-width: 760px; padding-bottom: 28px; border-bottom: 1px solid var(--line-soft); margin-bottom: 32px; }
.eyebrow { margin: 0; font: 500 12px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
h1 { margin: 0; font: 700 clamp(36px, 6vw, 56px)/1 var(--f-display); letter-spacing: -.02em; text-wrap: balance; }
.lede { margin: 0; max-width: 62ch; color: var(--ink-2); font-size: 16px; }
.legend { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13px; color: var(--ink-2); }
.legend li { display: flex; align-items: center; gap: 8px; }
.lg { display: inline-block; width: 22px; height: 14px; border-radius: 4px; border: 1.25px solid var(--line); background: var(--node); }
.lg-dec { width: 16px; height: 16px; border-radius: 2px; transform: rotate(45deg) scale(.82); }
.lg-ok { border: 2px solid var(--ink-2); background: var(--line-soft); }
.lg-end { border-style: dashed; background: transparent; }

/* layout */
.layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 40px; align-items: start; }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); display: grid; gap: 20px; max-height: calc(100vh - 48px); overflow-y: auto; padding-bottom: 8px; }
.nav-label { margin: 0 0 6px; font: 500 11px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--gc); }
.toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.toc a { display: flex; gap: 10px; padding: 5px 8px; border-radius: 6px; text-decoration: none; font-size: 13.5px; color: var(--ink-2); line-height: 1.35; }
.toc a:hover { background: var(--panel); color: var(--ink); }
.toc .n { font: 500 12px/1.6 var(--f-mono); color: var(--ink-3); font-variant-numeric: tabular-nums; }

.g-club { --gc: var(--club); --gt: var(--club-tint); }
.g-join { --gc: var(--join); --gt: var(--join-tint); }
.g-core { --gc: var(--core); --gt: var(--core-tint); }

/* flow sections */
.flows { display: grid; gap: 56px; min-width: 0; }
.flow { display: grid; gap: 16px; min-width: 0; scroll-margin-top: 24px; }
.flow-head { display: grid; gap: 6px; }
.flow-id { display: flex; align-items: center; gap: 10px; font: 500 12px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; }
.flow-id .num { color: var(--ink-3); font-variant-numeric: tabular-nums; }
.flow-id .grp { color: var(--gc); padding: 4px 7px; border-radius: 4px; background: var(--gt); }
h2 { margin: 0; font: 600 28px/1.15 var(--f-display); letter-spacing: -.01em; text-wrap: balance; }
.finding, .part-finding { margin: 0; color: var(--ink-2); max-width: 64ch; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 24px; margin: 4px 0 0; font-size: 13px; }
.meta div { display: flex; gap: 8px; }
.meta dt { color: var(--ink-3); font-family: var(--f-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; padding-top: 1px; }
.meta dd { margin: 0; color: var(--ink); }
.part { display: grid; gap: 6px; margin-top: 8px; }
.part h3 { margin: 0; font: 600 18px/1.2 var(--f-display); }
.part .canvas { margin-top: 8px; }

/* canvas */
.canvas {
  border: 1px solid var(--line-soft); border-radius: 12px; padding: 28px 24px;
  background-color: var(--panel);
  background-image: radial-gradient(var(--dot) 1px, transparent 1.2px);
  background-size: 16px 16px;
  overflow-x: auto;
}
.chart { --spine: 1.5px solid var(--line); width: max-content; max-width: 100%; }

.row { display: grid; grid-template-columns: var(--mainw) auto; --pt: 44px; }
.row.first { --pt: 0px; }
.main, .branches { padding-top: var(--pt); display: flex; flex-direction: column; justify-content: center; position: relative; }
.main { align-items: center; }

/* main spine */
.main::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; border-left: var(--spine); transform: translateX(-.75px); }
.row.first .main::before { top: 50%; }
.row.last .main::before { bottom: calc(50% - var(--pt) / 2); }
.row.first.last .main::before { display: none; }
.row.has-br .main::after { content: ""; position: absolute; left: 50%; right: 0; top: calc(50% + var(--pt) / 2); border-top: var(--spine); }

.nwrap { position: relative; z-index: 1; width: 100%; display: flex; justify-content: center; }
.row:not(.first) .nwrap::before {
  content: ""; position: absolute; top: -7px; left: 50%; width: 10px; height: 7px; transform: translateX(-50%);
  background: var(--line); clip-path: polygon(0 0, 100% 0, 50% 100%);
}
.inlab { position: absolute; bottom: 100%; left: calc(50% + 10px); margin-bottom: 12px; font: 500 11.5px/1 var(--f-mono); color: var(--ink-3); white-space: nowrap; }

/* nodes */
.node { width: 100%; background: var(--node); border: 1.25px solid var(--line); border-radius: 10px; padding: 11px 15px 12px; display: grid; gap: 2px; text-align: left; }
.node strong { font: 600 14px/1.3 var(--f-body); color: var(--ink); }
.node .sub { font-size: 12.5px; line-height: 1.4; color: var(--ink-2); }
.node.ok { border: 2px solid var(--gc); background: var(--gt); }
.node.end { border-style: dashed; border-color: var(--line); background: var(--panel); }
.node.end strong { color: var(--ink-2); }
.node:has(strong:only-child) { text-align: center; padding-block: 13px; }

.node.dec {
  width: 252px; height: 84px; padding: 0 44px; border: 0; border-radius: 0; background: var(--line);
  clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); display: flex; align-items: center; justify-content: center; position: relative;
}
.node.dec::before { content: ""; position: absolute; inset: 1.6px 2.4px; background: var(--node); clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
.node.dec span { position: relative; text-align: center; font: 500 13.5px/1.25 var(--f-body); color: var(--ink); text-wrap: balance; }

/* branches */
.branches { padding-left: var(--gapx); width: calc(var(--brw) + var(--gapx)); }
.branch { position: relative; padding-block: 6px; display: flex; }
.branch::after { content: ""; position: absolute; top: 50%; left: calc(-1 * var(--gapx)); width: var(--gapx); border-top: var(--spine); }
.ah { position: absolute; top: 50%; left: -8px; width: 8px; height: 10px; transform: translateY(-50%); background: var(--line); clip-path: polygon(0 0, 100% 50%, 0 100%); z-index: 1; }
.row.multi .branch::after { left: -28px; width: 28px; }
.row.multi .branch::before { content: ""; position: absolute; left: -28px; top: 0; bottom: 0; border-left: var(--spine); transform: translateX(-.75px); }
.row.multi .branch:first-child::before { top: 50%; }
.row.multi .branch:last-child::before { bottom: 50%; }
.row.multi .branches::after { content: ""; position: absolute; left: 0; width: 28px; top: calc(50% + var(--pt) / 2); border-top: var(--spine); }
.blab { position: absolute; left: calc(-1 * var(--gapx) + 6px); top: calc(50% - 20px); font: 500 11.5px/1 var(--f-mono); color: var(--ink-3); background: var(--panel); padding: 0 3px; }

/* tablet: index on top */
@media (max-width: 1060px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 28px; }
  .toc { position: static; max-height: none; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px 24px; overflow: visible; }
}

/* phone: one column, exits listed under their decision */
@media (max-width: 720px) {
  .page { padding-block: 28px 72px; }
  .toc { grid-template-columns: 1fr 1fr; }
  h2 { font-size: 24px; }
  .canvas { padding: 20px 14px 20px 30px; overflow-x: visible; }
  .chart { width: 100%; }
  .row { display: block; --pt: 30px; }
  .main { align-items: stretch; }
  .main::before { left: -16px; transform: none; }
  .row.first .main::before { top: 50%; }
  .row.last .main::before { bottom: calc(50% - var(--pt) / 2); }
  .row.has-br .main::after { display: none; }
  .nwrap { justify-content: flex-start; }
  .nwrap::after { content: ""; position: absolute; left: -16px; width: 16px; top: 50%; border-top: var(--spine); }
  .row:not(.first) .nwrap::before { top: 50%; left: -7px; width: 7px; height: 10px; transform: translateY(-50%); clip-path: polygon(0 0, 100% 50%, 0 100%); }
  .inlab { position: static; display: block; margin: 0 0 6px; }
  .nwrap:has(.inlab) { flex-direction: column; }
  .nwrap:has(.inlab)::after, .row:not(.first) .nwrap:has(.inlab)::before { top: calc(50% + 9px); }
  .node.dec { width: 100%; max-width: 300px; height: 76px; }
  .branches { width: auto; padding: 10px 0 0 22px; margin-left: 2px; position: relative; }
  .branches::before { content: ""; position: absolute; left: 6px; top: 0; bottom: 18px; border-left: 1.5px dashed var(--line); }
  .row:not(.last) .branches::after { content: ""; position: absolute; left: -16px; top: 0; bottom: 0; border-left: var(--spine); transform: none; width: 0; }
  .branch, .row.multi .branch { padding-block: 4px; flex-direction: column; }
  .branch::after, .row.multi .branch::after, .row.multi .branch::before, .ah { display: none; }
  .row.multi .branches::after { left: -16px; top: 0; width: 0; border-top: 0; }
  .blab { position: static; padding: 0; margin: 0 0 4px; background: none; }
  .blab::before { content: "if "; }
}

/* ---- editable flows ---- */
[hidden] { display: none !important; }
.node .sub { white-space: pre-line; }
body:not(.editing) [data-k]:empty { display: none; }
body:not(.editing) .node .sub:empty { display: none; }
.doc-count { margin: 0; font: 500 12px/1 var(--f-mono); color: var(--ink-3); letter-spacing: .06em; text-transform: uppercase; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.edfab { position: fixed; z-index: 30; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  border: 0; border-radius: 999px; padding: 12px 18px; background: var(--ink); color: var(--bg); font: 600 14px/1 var(--f-body); box-shadow: 0 10px 24px -12px rgba(0, 0, 0, .5); display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.edfab svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

body.editing { padding-bottom: 120px; }
body.editing [contenteditable] { border-radius: 4px; outline: 1px dashed transparent; outline-offset: 2px; cursor: text; min-width: 1ch; }
body.editing [contenteditable]:hover { outline-color: var(--line); }
body.editing [contenteditable]:focus { outline: 2px solid var(--focus); background: var(--panel); }
body.editing [contenteditable]:empty::before { content: attr(data-ph); color: var(--ink-3); font-style: italic; font-weight: 400; }
body.editing .node { cursor: pointer; }
body.editing .node.is-sel { box-shadow: 0 0 0 3px var(--focus); }
body.editing .node.dec.is-sel { background: var(--focus); }
body.editing .inlab, body.editing .blab { min-width: 3ch; }
body.editing .blab { background: var(--panel); }

.ed-flow { display: inline-flex; flex-wrap: wrap; gap: 6px; margin-left: auto; text-transform: none; letter-spacing: 0; }
.ed-flow select, .ed-flow button, .ed-mini, .edbar button { font: 500 12.5px/1 var(--f-body); color: var(--ink); background: var(--panel); border: 1px solid var(--line-soft); border-radius: 7px; padding: 6px 9px; cursor: pointer; }
.ed-flow button:disabled, .edbar button:disabled { opacity: .4; cursor: not-allowed; }
.danger { color: #c2410c !important; }
.flow-id { flex-wrap: wrap; }
.ed-mini { justify-self: start; }
.ed-add { font: 600 14px/1 var(--f-body); color: var(--ink-2); background: transparent; border: 1.5px dashed var(--line); border-radius: 10px; padding: 14px 18px; cursor: pointer; width: 100%; max-width: 340px; }
.ed-add.big { max-width: none; padding: 20px; }
.ed-add:hover { color: var(--ink); border-color: var(--ink-3); }

.edbar { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line-soft); box-shadow: 0 -10px 30px -18px rgba(0, 0, 0, .35);
  display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between;
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.edbar[hidden] { display: none !important; }
.ed-ctx, .ed-right { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
.ed-hint, .ed-status { font-size: 13px; color: var(--ink-2); }
.ed-status { margin-right: 6px; }
.ed-label { font: 500 11px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-right: 4px; }
.edbar .seg { display: inline-flex; border: 1px solid var(--line-soft); border-radius: 8px; overflow: hidden; }
.edbar .seg button { border: 0; border-radius: 0; border-right: 1px solid var(--line-soft); }
.edbar .seg button:last-child { border-right: 0; }
.edbar .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.edbar button.primary, .modal button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.modal { position: fixed; inset: 0; z-index: 40; background: rgba(10, 16, 14, .45); display: grid; place-items: center; padding: 16px; }
.modal-card { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; background: var(--bg); color: var(--ink); border-radius: 14px; padding: 20px; display: grid; gap: 12px; box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .5); }
.modal-card h3 { margin: 0; font: 600 20px/1.2 var(--f-display); }
.modal-body { display: grid; gap: 10px; font-size: 14px; color: var(--ink-2); }
.modal-body p { margin: 0; }
.modal-body .small { font-size: 12.5px; color: var(--ink-3); }
.modal-body .err { color: #c2410c; }
.modal-body .lbl { font: 500 11px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.modal-body textarea { width: 100%; font: 12px/1.4 var(--f-mono); color: var(--ink); background: var(--panel); border: 1px solid var(--line-soft); border-radius: 8px; padding: 10px; resize: vertical; }
.steps-list { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.modal-btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.modal-btns button { font: 600 13.5px/1 var(--f-body); padding: 10px 14px; border-radius: 9px; border: 1px solid var(--line-soft); background: var(--panel); color: var(--ink); cursor: pointer; }
.modal-btns .danger-fill { background: #c2410c; border-color: #c2410c; color: #fff; }
.ed-toast { position: fixed; z-index: 50; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 10px; font: 600 13.5px/1.2 var(--f-body); max-width: calc(100% - 32px); }
.ed-toast[hidden] { display: none; }
@media (max-width: 720px) { .ed-flow { margin-left: 0; width: 100%; } body.editing { padding-bottom: 200px; } }

/* ---- overview: description, scope, KPIs, metrics ---- */
.g-ov { --gc: var(--ink-2); --gt: var(--line-soft); }
.doc-meta { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 14px; font: 500 12px/1 var(--f-mono); color: var(--ink-3); letter-spacing: .06em; text-transform: uppercase; }
.doc-meta .doc-count { display: inline; }
.role { margin: 4px 0 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line-soft); background: var(--panel); font-size: 13.5px; color: var(--ink-2); max-width: 760px; }
.role b { font-weight: 600; color: var(--ink); }
.role .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); align-self: center; }
.role.is-pm .dot { background: var(--club); }
.role.is-view .dot { background: var(--core); }

.ov { display: grid; gap: 18px; min-width: 0; scroll-margin-top: 24px; }
.ov-head { display: grid; gap: 6px; }
.ov-eyebrow { margin: 0; font: 500 12px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.ov-lede { margin: 0; color: var(--ink-2); max-width: 64ch; }
.sec-split { margin: 8px 0 -32px; padding-top: 28px; border-top: 1px solid var(--line-soft); font: 500 12px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); scroll-margin-top: 24px; }

/* description */
.desc { margin: 0; display: grid; border-top: 1px solid var(--line-soft); }
.desc-row { display: grid; grid-template-columns: 170px minmax(0, 1fr) auto; gap: 6px 24px; padding: 14px 0; border-bottom: 1px solid var(--line-soft); align-items: start; }
.desc dt { font: 600 14px/1.5 var(--f-body); color: var(--ink); }
.desc dd { margin: 0; color: var(--ink-2); max-width: 70ch; }

/* scope */
.scope-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.scope-col { border: 1px solid var(--line-soft); border-radius: 12px; background: var(--panel); padding: 16px 18px; display: grid; gap: 10px; align-content: start; }
.scope-col h3 { margin: 0; font: 600 16px/1.2 var(--f-display); display: flex; align-items: center; gap: 8px; }
.scope-col .cnt { font: 500 11.5px/1 var(--f-mono); color: var(--ink-3); padding: 3px 6px; border-radius: 4px; background: var(--bg); }
.scope-col ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.scope-col li { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 10px; align-items: start; font-size: 14px; line-height: 1.45; }
.scope-col li i { width: 16px; height: 16px; margin-top: 2px; border-radius: 50%; position: relative; }
.scope-col.in li i { background: var(--club-tint); box-shadow: inset 0 0 0 1.5px var(--club); }

    {
      "id": "f06",
      "group": "manual",
      "title": "Allocate the 40 manual matching points",
      "who": "Manual scoring system",
      "where": "Application-time manual calculation",
      "parts": [
        {
          "sub": "",
          "finding": "EMP-R03/07 / AC-09–12: only absent employer-defined criteria redistribute, and only within the manual budget.",
          "nodes": [
            {
              "t": "Load base manual weights",
              "l": [
                "Education 15 · Salary 10 · Location 5 · Age 5 · Gender 5; base total 40."
              ]
            },
            {
              "t": "Resolve which requirements are available",
              "l": [
                "Education exists if any education subfield is supplied by recruiter or, when recruiter education is blank, by Content Team.",
                "Configured hidden Salary/Age remain eligible. Candidate missing facts never make employer requirements unavailable."
              ]
            },
            {
              "t": "Apply the Gender exception",
              "l": [
                "Any or unspecified Gender remains eligible and earns its full effective allocation; do not redistribute it.",
                "A distinct invalid Gender input state requires product definition."
              ]
            },
            {
              "t": "Sum eligible base weights",
              "l": [
                "S = sum of base weights of available manual criteria; fully absent Education contributes no eligible base weight."
              ]
            },
            {
              "t": "Eligible weight sum > 0?",
              "l": [],
              "type": "dec",
              "br": [
                {
                  "lab": "no",
                  "t": "Calculation needs a recovery rule",
                  "l": [
                    "Do not divide by zero or transfer the 40 points into AI.",
                    "OPEN / DRAFT fallback: keep the score pending until the invalid-input recovery rule is agreed. Gender unspecified normally prevents this case."
                  ],
                  "kind": "end"
                }
              ]
            },
            {
              "t": "Calculate effective criterion weights",
              "l": [
                "Effective_i = base_i ÷ S × 40 for each available manual criterion.",
                "When all requirements are present: 15 / 10 / 5 / 5 / 5. Keep full precision; round only for presentation."
              ],
              "lab": "yes"
            },
            {
              "t": "Apply single-absence allocations",
              "l": [
                "Salary absent → Education 20; Location/Age/Gender 6.6667 each. Education absent → Salary 16; Location/Age/Gender 8 each.",
                "Location absent → Education 17.142857; Salary 11.428571; Age/Gender 5.714286 each.",
                "Education + Salary absent → Location/Age/Gender 13.3333 each."
              ]
            },
            {
              "t": "Apply combined-absence allocations",
              "l": [
                "Salary + Location absent → Education 24; Age/Gender 8 each. Education + Location absent → Salary 20; Age/Gender 10 each.",
                "Education + Salary + Location absent → Age/Gender 20 each. Defensive only-Salary-retained case → Salary 40.",
                "The last case needs a distinct invalid/unavailable Gender state; ordinary unspecified Gender retains points."
              ]
            },
            {
              "t": "Pass effective weights to field matching",
              "l": [
                "Apply education subfield distribution only after its effective weight is known; see flows 07–11.",
                "Mismatching or missing candidate data earns 0 in the affected required field; never shrink the denominator or redistribute its points."
              ]
            },
            {
              "t": "Eligible manual weights total 40",
              "l": [
                "Record the exact 40-point budget; rounded displayed allocations may visually total 39.99 or 40.01.",
                "AI remains fixed at 60; no AI/manual cross-transfer is permitted."
              ],
              "type": "ok"
            }
          ]
        }
      ]
    },
    {

      return `<div class="grp-row"><input class="ed-input" data-gi="${i}" value="${esc(g.label)}" aria-label="Group name"><select data-gc="${i}" aria-label="Colour">${COLORS.map(([v, l]) => `<option value="${v}"${g.color === v ? ' selected' : ''}>${l}</option>`).join('')}</select><span class="small">${used} flow${used === 1 ? '' : 's'}</span><button data-gd="${i}" class="danger" ${D.groups.length < 2 ? 'disabled' : ''} aria-label="Remove group">×</button></div>`;
    }).join('');
    const m = modal('Flow groups', `<p>Groups sort the flows in the contents, for example by user type. Removing a group moves its flows to the first group.</p><div class="grp-list">${rows()}</div><button class="ed-mini" data-gadd type="button">+ Add group</button>`, [{ label: 'Done', cls: 'primary' }]);
    const list = m.querySelector('.grp-list'), redraw = () => { list.innerHTML = rows(); };
    m.addEventListener('change', e => {
      const t = e.target;
      if (t.dataset.gi != null) { const v = t.value.trim(); if (v) mutate(() => { D.groups[+t.dataset.gi].label = v; }); }
      if (t.dataset.gc != null) mutate(() => { D.groups[+t.dataset.gc].color = t.value; });
    });
    m.addEventListener('click', e => {
      const d = e.target.closest('[data-gd]');
      if (d && !d.disabled) { const i = +d.dataset.gd; mutate(() => { const gone = D.groups.splice(i, 1)[0]; D.flows.forEach(f => { if (f.group === gone.id) f.group = D.groups[0].id; }); }); redraw(); }
      if (e.target.closest('[data-gadd]')) { mutate(() => { D.groups.push({ id: 'g' + Date.now().toString(36), label: 'New group', color: 'core' }); }); redraw(); const ins = list.querySelectorAll('input'); const last = ins[ins.length - 1]; if (last) { last.focus(); last.select(); } }
    });
  }

  // A page made from the template gets its own id the first time it is saved, so two products never share browser storage.
  const slug = s => String(s || 'product').toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'product';
  function outData() {
    const data = clone(D); data.rev = Date.now(); data.updated = new Date().toISOString();
    if (ORIGINAL.template) { delete data.template; data.id = slug(D.title) + '-' + Date.now().toString(36); data.file = D.title.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-') + '-Requirement-Flow'; }
    else data.id = ORIGINAL.id;
    return data;
  }

  function toast(m) { let t = $('#ed-toast'); if (!t) { t = document.createElement('div'); t.id = 'ed-toast'; t.className = 'ed-toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); } t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 2200); }

  render();
  if (pending === 'published') setTimeout(() => toast('Published. Everyone with the link now sees this version.'), 300);
  else if (pending && pending.data) modal('Restore your unpublished edits?', '<p>Someone else published this page while you were editing, so your last publish did not go through. You can put your edits back on top of their version, or keep theirs.</p>', [
    { label: 'Keep their version', on: () => { try { sessionStorage.removeItem(PKEY); } catch (_) {} } },
    { label: 'Restore my edits', cls: 'primary', on: () => { try { sessionStorage.removeItem(PKEY); } catch (_) {} snap(); D = pending.data; save(); editing = true; render(); } }
  ]);
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('artifact').then(a => { ART = a || null; if (editing) renderBar(); }).catch(() => {});
    window.claude.use('downloads').then(d => { DL = d || null; }).catch(() => {});
  }
})();
</script>
</body>
</html>
